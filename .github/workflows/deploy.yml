# Deploys the site to Vercel production on every push to main — including edits made
# directly on github.com (e.g. uploading a new public/resume/Vimal_Selvaraj_Resume.pdf).
#
# Uses a Vercel access token instead of Vercel's GitHub integration, so it works even
# though the Vercel account signs in with Google.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       – vercel.com/account/settings/tokens
#   VERCEL_ORG_ID      – "orgId" from .vercel/project.json
#   VERCEL_PROJECT_ID  – "projectId" from .vercel/project.json

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button for a manual redeploy

# A newer push supersedes an in-progress deploy.
concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Pulls the production settings and env vars (e.g. VITE_SITE_URL) from Vercel.
      - name: Pull Vercel settings
        run: npx --yes vercel@66.6.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes vercel@66.6.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: npx --yes vercel@66.6.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
