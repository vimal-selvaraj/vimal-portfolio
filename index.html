<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#07080a" />
    <!-- Apply the saved (or system) theme before first paint, so there is no flash of the wrong theme. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('vs-theme')
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = t
          if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f6f8')
        } catch (e) {}
      })()
    </script>

    <title>Vimal Selvaraj — Full-Stack Developer | ReactJS · NodeJS · PostgreSQL</title>
    <meta
      name="description"
      content="Vimal Selvaraj is a Full-Stack Developer with 5+ years of experience building scalable enterprise applications with ReactJS, TypeScript, NodeJS, ExpressJS and PostgreSQL."
    />
    <meta name="author" content="Vimal Selvaraj" />

    <!-- Social previews. Set VITE_SITE_URL in .env to the deployed origin so crawlers get absolute URLs. -->
